<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/ericjkuhns/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/ericjkuhns/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/ericjkuhns/apple-touch-icon.png">
<title>Page Not Found | Eric J. Kuhns</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0a0c0a;--panel:#101410;--panel2:#0d110d;--ink:#f4f6f4;--muted:#8a938c;--line:#1e241e;--neon:#39ff64;--neon-dim:#1f8a37}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,'Courier New',monospace}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.14) 3px,transparent 4px);mix-blend-mode:overlay;opacity:.5}
  a{color:inherit;text-decoration:none}
  .box{max-width:600px;width:100%;text-align:center}
  .code{font:12px 'JetBrains Mono',monospace;color:var(--neon);letter-spacing:3px;margin-bottom:18px}
  h1{font-size:clamp(60px,14vw,120px);font-weight:800;letter-spacing:-4px;line-height:1;color:var(--neon);text-shadow:0 0 40px rgba(57,255,100,.3);margin-bottom:12px}
  .caret{animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  h2{font-size:clamp(20px,4vw,26px);font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
  p{color:var(--muted);font-size:15px;margin-bottom:28px;max-width:460px;margin-left:auto;margin-right:auto}
  #status{font:13px 'JetBrains Mono',monospace;color:var(--neon-dim);margin-bottom:22px;min-height:1.2em}
  .search{display:flex;gap:0;max-width:420px;margin:0 auto 26px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--panel2)}
  .search input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font:14px 'JetBrains Mono',monospace;padding:13px 16px}
  .search input::placeholder{color:var(--muted)}
  .search button{background:var(--panel);border:0;border-left:1px solid var(--line);color:var(--neon);font:13px 'JetBrains Mono',monospace;font-weight:700;padding:0 18px;cursor:pointer;transition:all .2s}
  .search button:hover{background:var(--neon);color:#04160a}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{font:13px 'JetBrains Mono',monospace;letter-spacing:.5px;padding:13px 22px;border:1px solid var(--line);border-radius:2px;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--neon);color:#04160a;border-color:var(--neon);font-weight:700}
  .btn-primary:hover{box-shadow:0 0 24px rgba(57,255,100,.4)}
  .btn-ghost:hover{border-color:var(--neon);color:var(--neon)}
  .quick{margin-top:30px;padding-top:24px;border-top:1px solid var(--line);font:12px 'JetBrains Mono',monospace;color:var(--muted)}
  .quick a{color:var(--neon-dim);margin:0 8px;transition:color .2s}
  .quick a:hover{color:var(--neon)}
</style>
</head>
<body>
<div class="box">
  <div class="code mono">// ERROR 404 · FILE NOT FOUND</div>
  <h1>404<span class="caret">_</span></h1>
  <h2 id="headline">This page took a sidequest.</h2>
  <p id="msg">The page you're looking for doesn't exist here, maybe it moved when I rebuilt the site. Let's get you back on track.</p>
  <div id="status" class="mono"></div>
  <form class="search" id="searchForm" role="search">
    <input type="text" id="searchInput" class="mono" placeholder="search the site…" aria-label="Search">
    <button type="submit">▸ GO</button>
  </form>
  <div class="links">
    <a href="/ericjkuhns/index.html" class="btn btn-primary mono">▸ Go Home</a>
    <a href="/ericjkuhns/blog/index.html" class="btn btn-ghost mono">Read the Blog</a>
  </div>
  <div class="quick mono">
    <a href="/ericjkuhns/eric-tech-world.html">Tech World</a>·
    <a href="/ericjkuhns/skateboarding.html">Skateboarding</a>·
    <a href="/ericjkuhns/writing.html">Writing</a>·
    <a href="/ericjkuhns/portfolio.html">Portfolio</a>·
    <a href="/ericjkuhns/contact.html">Contact</a>
  </div>
</div>

<script>
(function(){
  var BLOG_ID = "ericjkuhns.blogspot.com";
  var BASE = "/ericjkuhns";
  var path = window.location.pathname;

  // Only attempt a blog redirect for old blog-style URLs: /ericjkuhns/blog/<slug>
  // (your old Squarespace posts lived at /blog/<slug>)
  var m = path.match(/\/blog\/([^\/?#]+)\/?$/i);
  // ignore the real app files
  if(m && m[1] && m[1] !== 'index.html' && m[1] !== 'post.html'){
    var slug = m[1].toLowerCase();
    var statusEl = document.getElementById('status');
    statusEl.textContent = '▸ Looking for that post in the archive…';

    // normalize: strip trailing .html, turn to comparable word set
    slug = slug.replace(/\.html$/,'');
    var slugWords = slug.split('-').filter(function(w){ return w.length > 2; });

    var CB = 'notfound_' + Math.floor(Math.random()*1e9);
    var timer = setTimeout(function(){ giveUp(); }, 7000);

    window[CB] = function(json){
      clearTimeout(timer);
      try{
        var entries = (json.feed && json.feed.entry) ? json.feed.entry : [];
        var best = null, bestScore = 0;
        entries.forEach(function(e){
          var alt = (e.link||[]).find(function(l){ return l.rel==='alternate'; });
          var href = alt ? alt.href : '';
          var pm = href.match(/\/(\d{4})\/(\d{2})\/([^\/]+)\.html/);
          if(!pm) return;
          var postSlug = pm[3].toLowerCase();
          // exact slug match wins immediately
          if(postSlug === slug){ best = pm; bestScore = 999; return; }
          // otherwise score by shared words
          var score = 0;
          slugWords.forEach(function(w){ if(postSlug.indexOf(w) !== -1) score++; });
          if(score > bestScore){ bestScore = score; best = pm; }
        });
        // require a decent match (exact, or at least half the words)
        if(best && (bestScore === 999 || bestScore >= Math.max(2, Math.ceil(slugWords.length/2)))){
          statusEl.textContent = '▸ Found it! Redirecting…';
          var target = BASE + '/blog/post.html?p=' + encodeURIComponent(best[1]+'/'+best[2]+'/'+best[3]);
          setTimeout(function(){ window.location.replace(target); }, 700);
        } else {
          giveUp();
        }
      }catch(err){ giveUp(); }
    };

    function giveUp(){
      var s = document.getElementById('status');
      if(s) s.textContent = '▸ Couldn’t find that exact post. Try the blog or search below.';
    }

    var s = document.createElement('script');
    s.src = 'https://' + BLOG_ID + '/feeds/posts/default?alt=json-in-script&max-results=500&callback=' + CB;
    s.onerror = giveUp;
    document.body.appendChild(s);
  }

  // Search box: send the query to the blog listing page (which has search built in)
  var form = document.getElementById('searchForm');
  if(form){
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var q = document.getElementById('searchInput').value.trim();
      var dest = BASE + '/blog/index.html';
      if(q) dest += '?q=' + encodeURIComponent(q);
      window.location.href = dest;
    });
  }
})();
</script>
</body>
</html>
