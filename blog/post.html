<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

<title>Loading… | Eric Kuhns</title>

<style>
  :root{
    --bg:#0a0c0a;
    --panel:#101410;
    --ink:#f4f6f4;
    --muted:#8a938c;
    --line:#1e241e;
    --neon:#39ff64;
    --neon-dim:#1f8a37;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .mono{
    font-family:'JetBrains Mono','SF Mono',ui-monospace,'Courier New',monospace;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.14) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode:overlay;
    opacity:.5;
  }

  a{
    color:var(--neon);
    text-decoration:none;
  }

  a:hover{
    text-decoration:underline;
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 24px;
  }

  .back{
    display:inline-block;
    margin:32px 0 0;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
  }

  .back:hover{
    color:var(--neon);
    text-decoration:none;
  }

  article{
    padding:24px 0 80px;
  }

  .post-head{
    padding:20px 0 28px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }

  .post-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--neon);
    letter-spacing:1px;
    margin-bottom:16px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }

  .post-meta .sep{
    color:var(--muted);
  }

  .post-meta .cat{
    color:var(--muted);
    border:1px solid var(--line);
    padding:2px 8px;
    border-radius:2px;
  }

  h1.title{
    font-size:clamp(30px,5vw,48px);
    font-weight:800;
    letter-spacing:-1.5px;
    line-height:1.05;
  }

  .content{
    font-size:17px;
    color:#dfe4df;
  }

  .content h2{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.5px;
    margin:40px 0 14px;
    color:var(--ink);
  }

  .content h3{
    font-size:20px;
    font-weight:700;
    margin:32px 0 10px;
    color:var(--ink);
  }

  .content h1{
    font-size:28px;
    font-weight:800;
    margin:36px 0 12px;
    color:var(--ink);
  }

  .content p{
    margin:0 0 20px;
  }

  .content ul,
  .content ol{
    margin:0 0 20px 22px;
  }

  .content li{
    margin:0 0 8px;
  }

  .content img{
    max-width:100%;
    height:auto;
    border:1px solid var(--line);
    border-radius:3px;
    margin:12px 0;
    display:block;
  }

  .content img.zoomable{
    cursor:zoom-in;
    transition:opacity .15s;
  }

  .content img.zoomable:hover{
    opacity:.9;
  }

  .content a{
    color:var(--neon);
  }

  .content blockquote{
    border-left:3px solid var(--neon-dim);
    padding:4px 0 4px 20px;
    margin:0 0 20px;
    color:var(--muted);
    font-style:italic;
  }

  .content b,
  .content strong{
    color:var(--ink);
  }

  .content iframe{
    max-width:100%;
    border:0;
    border-radius:3px;
    margin:0 0 20px;
  }

  .content .yt-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    margin:0 0 20px;
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    background:#000;
  }

  .content .yt-wrap iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    margin:0;
  }

  .yt-placeholder{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    padding:0;
    cursor:pointer;
    background:#000;
    overflow:hidden;
  }

  .yt-placeholder img{
    width:100%;
    height:100%;
    object-fit:cover;
    margin:0 !important;
    border:0 !important;
    border-radius:0 !important;
  }

  .yt-placeholder::after{
    content:"▶";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:68px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
    color:#fff;
    font-size:24px;
    line-height:1;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.25);
    transition:transform .15s,background .15s;
  }

  .yt-placeholder:hover::after{
    transform:translate(-50%,-50%) scale(1.08);
    background:#ff0000;
  }

  .content hr{
    border:0;
    border-top:1px solid var(--line);
    margin:32px 0;
  }

  .content table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 20px;
  }

  .content td,
  .content th{
    border:1px solid var(--line);
    padding:8px 10px;
  }

  .loading,
  .err{
    font-family:'JetBrains Mono',monospace;
    color:var(--muted);
    padding:60px 0;
  }

  .err a{
    color:var(--neon);
  }

  .img-lightbox{
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(5,7,5,.94);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
    cursor:zoom-out;
  }

  .img-lightbox.open{
    display:flex;
    animation:lbfade .18s ease;
  }

  @keyframes lbfade{
    from{opacity:0}
    to{opacity:1}
  }

  .img-lightbox img{
    max-width:94vw;
    max-height:90vh;
    border:1px solid var(--neon-dim);
    border-radius:4px;
    box-shadow:0 0 60px rgba(57,255,100,.12);
  }

  .img-lightbox .lb-close{
    position:absolute;
    top:18px;
    right:24px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:22px;
    width:42px;
    height:42px;
    border-radius:4px;
    cursor:pointer;
    line-height:1;
    transition:all .2s;
  }

  .img-lightbox .lb-close:hover{
    border-color:var(--neon);
    color:var(--neon);
  }

  @media(max-width:820px){
  }

  @media(prefers-reduced-motion:reduce){
    *{
      animation:none!important;
      transition:none!important;
    }
  }
</style>

<link rel="stylesheet" href="../site.css?v=6">
</head>

<body>

<script>
  window.SITE={
    active:"blog",
    base:"../"
  };
</script>

<div id="site-nav"></div>

<div class="wrap">
  <a href="index.html" class="back">← back to all posts</a>
</div>

<article class="wrap" id="article">
  <div class="loading mono">Loading post…</div>
</article>

<div id="site-footer"></div>

<script src="blog-config.js"></script>

<script>
  document.addEventListener('click',function(e){
    if(!e.target.closest('.nav-drop')){
      document.querySelectorAll('.nav-drop.open').forEach(function(d){
        d.classList.remove('open');
      });
    }
  });

  function getParam(name){
    const m=new RegExp('[?&]'+name+'=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function esc(s){
    return (s||"")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");
  }

  function fmtDate(iso){
    try{
      return new Date(iso).toLocaleDateString(
        'en-US',
        {
          year:'numeric',
          month:'long',
          day:'numeric'
        }
      );
    }catch(e){
      return '';
    }
  }

  function cleanContent(html){
    const tmp=document.createElement('div');
    tmp.innerHTML=html||'';

    tmp.querySelectorAll('script,style,link').forEach(function(n){
      n.remove();
    });

    tmp.querySelectorAll('[style]').forEach(function(n){
      n.removeAttribute('style');
    });

    tmp.querySelectorAll('[bgcolor]').forEach(function(n){
      n.removeAttribute('bgcolor');
    });

    /*
     * Turn YouTube embeds into lightweight thumbnails.
     * The actual YouTube player only loads after a click.
     */
    tmp.querySelectorAll('iframe').forEach(function(f){

      const src=f.getAttribute('src')||'';

      const youtubeMatch=src.match(
        /(?:youtube\.com\/embed\/|youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{6,})/
      );

      if(youtubeMatch){

        const videoId=youtubeMatch[1];

        const wrap=document.createElement('div');
        wrap.className='yt-wrap';

        const button=document.createElement('button');
        button.type='button';
        button.className='yt-placeholder';
        button.setAttribute('data-video-id',videoId);
        button.setAttribute('aria-label','Play YouTube video');

        const thumb=document.createElement('img');
        thumb.src='https://i.ytimg.com/vi/'+videoId+'/hqdefault.jpg';
        thumb.alt=f.getAttribute('title')||'YouTube video';
        thumb.loading='lazy';
        thumb.decoding='async';
        thumb.setAttribute('data-youtube-thumb','true');

        button.appendChild(thumb);
        wrap.appendChild(button);

        f.parentNode.replaceChild(wrap,f);

      }else{

        /*
         * Keep non-YouTube embeds,
         * but lazy-load them.
         */
        const wrap=document.createElement('div');
        wrap.className='yt-wrap';

        f.parentNode.insertBefore(wrap,f);
        wrap.appendChild(f);

        f.removeAttribute('width');
        f.removeAttribute('height');

        f.setAttribute('loading','lazy');
      }
    });

    /*
     * Blogger often wraps uploaded images in links
     * pointing to the full-size Blogger-hosted file.
     * Remove those links and let our lightbox handle them.
     */
    tmp.querySelectorAll('a').forEach(function(a){

      var img=a.querySelector('img');

      if(
        img &&
        (
          /\.(jpe?g|png|gif|webp|bmp)(\?|$)/i.test(a.href) ||
          /blogger\.googleusercontent|bp\.blogspot/i.test(a.href)
        )
      ){
        img.setAttribute(
          'data-full',
          a.getAttribute('href') || img.src
        );

        a.parentNode.insertBefore(img,a);
        a.remove();
      }
    });

    /*
     * Mark normal article images as zoomable.
     * YouTube thumbnails are excluded.
     */
    tmp.querySelectorAll('img').forEach(function(img){

      if(img.getAttribute('data-youtube-thumb')==='true'){
        return;
      }

      img.classList.add('zoomable');

      if(!img.getAttribute('data-full')){
        img.setAttribute('data-full',img.src);
      }

      if(!img.getAttribute('loading')){
        img.setAttribute('loading','lazy');
      }

      img.setAttribute('decoding','async');
    });

    return tmp.innerHTML;
  }

  /*
   * Click-to-load YouTube player.
   */
  document.addEventListener('click',function(e){

    const button=e.target.closest('.yt-placeholder');

    if(!button){
      return;
    }

    e.preventDefault();

    const videoId=button.getAttribute('data-video-id');

    if(!videoId){
      return;
    }

    const iframe=document.createElement('iframe');

    iframe.src=
      'https://www.youtube.com/embed/' +
      encodeURIComponent(videoId) +
      '?autoplay=1';

    const image=button.querySelector('img');

    iframe.title=
      image && image.alt
        ? image.alt
        : 'YouTube video';

    iframe.allow=
      'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';

    iframe.allowFullscreen=true;

    button.replaceWith(iframe);
  });

  function renderPost(post){

    const title=
      post.title
        ? post.title.$t
        : 'Untitled';

    const date=
      post.published
        ? post.published.$t
        : '';

    const cats=
      (post.category||[]).map(function(c){
        return c.term;
      });

    const content=
      (post.content && post.content.$t)
        || '';

    document.title=
      title+' | Eric Kuhns';

    document.getElementById('article').innerHTML=
      '<div class="post-head">'+
        '<div class="post-meta mono">'+
          fmtDate(date)+
          (
            cats.length
              ? '<span class="sep">/</span>'+
                cats.map(function(c){
                  return '<span class="cat">'+esc(c)+'</span>';
                }).join('')
              : ''
          )+
        '</div>'+
        '<h1 class="title">'+esc(title)+'</h1>'+
      '</div>'+
      '<div class="content">'+
        cleanContent(content)+
      '</div>';
  }

  function fail(){
    document.getElementById('article').innerHTML=
      '<div class="err mono">'+
      'Couldn\'t load this post. '+
      '<a href="index.html">Back to all posts →</a>'+
      '</div>';
  }

  const slug=getParam('p');

  const article=
    document.getElementById('article');

  if(
    typeof BLOG_ID==='undefined' ||
    !BLOG_ID
  ){

    article.innerHTML=
      '<div class="err mono">'+
      'Blog not configured yet.'+
      '</div>';

  }else if(!slug){

    article.innerHTML=
      '<div class="err mono">'+
      'No post specified. '+
      '<a href="index.html">Back to all posts →</a>'+
      '</div>';

  }else{

    function slugOf(e){

      const alt=
        (e.link||[]).find(function(l){
          return l.rel==='alternate';
        });

      const href=
        alt
          ? alt.href
          : '';

      const m=
        href.match(
          /\/(\d{4})\/(\d{2})\/([^\/]+)\.html/
        );

      return m
        ? (
            m[1]+'/'+
            m[2]+'/'+
            m[3]
          )
        : encodeURIComponent(e.id.$t);
    }

    /*
     * Page through Blogger feed until
     * matching post is found.
     */
    let start=1;

    const BATCH=500;

    let attempts=0;

    function fetchBatch(){

      attempts++;

      const CB=
        'bloggerFind_' +
        Math.floor(
          Math.random()*1e9
        );

      window[CB]=function(json){

        const entries=
          (
            json.feed &&
            json.feed.entry
          )
            ? json.feed.entry
            : [];

        const match=
          entries.find(function(e){
            return slugOf(e)===slug;
          });

        if(match){

          renderPost(match);

          try{
            delete window[CB];
          }catch(e){}

          return;
        }

        if(
          entries.length===BATCH &&
          attempts<6
        ){

          start+=BATCH;

          try{
            delete window[CB];
          }catch(e){}

          fetchBatch();

        }else{

          fail();
        }
      };

      const s=
        document.createElement('script');

      s.src=
        'https://'+
        BLOG_ID+
        '/feeds/posts/default'+
        '?alt=json-in-script'+
        '&max-results='+BATCH+
        '&start-index='+start+
        '&callback='+CB;

      s.onerror=fail;

      document.body.appendChild(s);
    }

    fetchBatch();
  }
</script>

<div class="img-lightbox" id="imgLightbox">
  <button
    class="lb-close"
    type="button"
    aria-label="Close image"
    onclick="closeImgLightbox()"
  >×</button>

  <img
    id="imgLightboxImg"
    src=""
    alt=""
  >
</div>

<script>
  (function(){

    var lb=
      document.getElementById('imgLightbox');

    var lbImg=
      document.getElementById('imgLightboxImg');

    if(!lb || !lbImg){
      return;
    }

    /*
     * Any normal article image opens lightbox.
     */
    document.addEventListener(
      'click',
      function(e){

        var img=e.target;

        if(
          img &&
          img.tagName==='IMG' &&
          img.classList.contains('zoomable')
        ){

          e.preventDefault();

          lbImg.src=
            img.getAttribute('data-full') ||
            img.src;

          lbImg.alt=
            img.alt ||
            '';

          lb.classList.add('open');

          document.body.style.overflow=
            'hidden';
        }
      }
    );

    /*
     * Clicking backdrop closes lightbox.
     */
    lb.addEventListener(
      'click',
      function(e){

        if(e.target===lb){
          closeImgLightbox();
        }
      }
    );

    window.closeImgLightbox=
      function(){

        lb.classList.remove('open');

        lbImg.src='';

        document.body.style.overflow='';
      };

    document.addEventListener(
      'keydown',
      function(e){

        if(
          e.key==='Escape' &&
          lb.classList.contains('open')
        ){
          closeImgLightbox();
        }
      }
    );

  })();
</script>

<script src="../site.js?v=6"></script>

</body>
</html>
