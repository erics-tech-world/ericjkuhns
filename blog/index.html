<script>
  // typewriter effect for the blog title
  (function(){
    const target = document.getElementById('typed-title');
    if(!target) return;

    const text = "Eric J. Kuhns Blog";
    const reduce =
      window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if(reduce){
      target.textContent = text;
      return;
    }

    let i = 0;

    (function tick(){
      if(i <= text.length){
        target.textContent = text.slice(0,i);
        i++;
        setTimeout(tick, 65);
      }
    })();
  })();


  document.addEventListener('click', function(e){
    if(!e.target.closest('.nav-drop')){
      document
        .querySelectorAll('.nav-drop.open')
        .forEach(function(d){
          d.classList.remove('open');
        });
    }
  });


  function esc(s){
    return (s || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }


  function fmtDate(iso){
    try{
      return new Date(iso).toLocaleDateString(
        'en-US',
        {
          year:'numeric',
          month:'short',
          day:'numeric'
        }
      );
    }catch(e){
      return '';
    }
  }


  function firstImage(html){
    const m =
      (html || '').match(
        /<img[^>]+src=["']([^"']+)["']/i
      );

    return m ? m[1] : '';
  }


  function toText(html){
    const d = document.createElement('div');

    d.innerHTML = html || '';

    return (d.textContent || '')
      .replace(/\s+/g,' ')
      .trim();
  }


  function postSlug(entry){
    const alt =
      (entry.link || []).find(function(l){
        return l.rel === 'alternate';
      });

    const href =
      alt
        ? alt.href
        : '';

    const m =
      href.match(
        /\/(\d{4})\/(\d{2})\/([^\/]+)\.html/
      );

    return m
      ? (
          m[1] + '/' +
          m[2] + '/' +
          m[3]
        )
      : encodeURIComponent(
          entry.id && entry.id.$t
            ? entry.id.$t
            : href
        );
  }


  /*
   * Stable unique ID for duplicate protection.
   *
   * Blogger's entry.id is preferred.
   * If for some reason it is missing,
   * fall back to the post slug.
   */
  function postKey(entry){
    if(
      entry &&
      entry.id &&
      entry.id.$t
    ){
      return entry.id.$t;
    }

    return postSlug(entry);
  }



  const PAGE = 30;

  /*
   * Blogger uses 1-based indexing.
   */
  let startIndex = 1;

  /*
   * Blogger's reported total.
   */
  let totalPosts = null;

  /*
   * Unique posts we have successfully loaded.
   */
  let allLoaded = [];

  /*
   * Keys already seen.
   * This prevents duplicate cards even if
   * Blogger returns overlapping batches.
   */
  let loadedKeys = new Set();

  let fetching = false;

  let renderedOnce = false;

  /*
   * True once Blogger returns fewer than PAGE
   * results or no results.
   *
   * This is more reliable than using only
   * allLoaded.length >= totalPosts.
   */
  let archiveExhausted = false;


  const postsEl =
    document.getElementById('posts');

  const moreBtn =
    document.getElementById('more');

  const countEl =
    document.getElementById('count');



  function cardHTML(e){

    const title =
      e.title
        ? e.title.$t
        : 'Untitled';


    const content =
      (
        e.content &&
        e.content.$t
      ) ||
      (
        e.summary &&
        e.summary.$t
      ) ||
      '';


    const date =
      e.published
        ? e.published.$t
        : '';


    const img =
      firstImage(content);


    const cats =
      (e.category || []).map(function(c){
        return c.term;
      });


    const slug =
      postSlug(e);


    /*
     * Keep the visible excerpt short...
     */
    const fullText =
      toText(content);


    const excerpt =
      fullText.length > 120
        ? fullText.slice(0,120) + '…'
        : fullText;


    /*
     * ...but search the ENTIRE article body.
     *
     * This fixes articles that contain the
     * search word later than the first
     * 120 characters.
     */
    const searchText =
      (
        title + ' ' +
        fullText + ' ' +
        cats.join(' ')
      )
      .toLowerCase();


    const thumbStyle =
      img
        ? (
            ' style="background-image:url(\'' +
            esc(img) +
            '\')"'
          )
        : '';


    const thumbText =
      img
        ? ''
        : (
            '[ ' +
            esc(cats[0] || 'post') +
            ' ]'
          );


    return (
      '<a class="post"' +
        ' href="post.html?p=' +
        encodeURIComponent(slug) +
        '"' +
        ' data-search="' +
        esc(searchText) +
        '">' +

        '<div class="post-thumb"' +
          thumbStyle +
        '>' +
          thumbText +
        '</div>' +

        '<div class="post-body">' +

          '<span class="date mono">' +
            fmtDate(date) +
          '</span>' +

          '<h3>' +
            esc(title) +
          '</h3>' +

          '<div class="excerpt">' +
            esc(excerpt) +
          '</div>' +

          (
            cats.length
              ? (
                  '<div class="cats">' +

                    cats
                      .map(function(c){
                        return (
                          '<span class="cat mono">' +
                          esc(c) +
                          '</span>'
                        );
                      })
                      .join('') +

                  '</div>'
                )
              : ''
          ) +

        '</div>' +

      '</a>'
    );
  }



  function renderAppend(entries){

    if(
      !renderedOnce ||
      postsEl.querySelector('.empty')
    ){
      postsEl.innerHTML = '';
      renderedOnce = true;
    }


    entries.forEach(function(e){

      postsEl.insertAdjacentHTML(
        'beforeend',
        cardHTML(e)
      );

    });


    applyFilter();
  }



  function allPostsLoaded(){

    if(archiveExhausted){
      return true;
    }

    if(
      totalPosts !== null &&
      startIndex > totalPosts
    ){
      return true;
    }

    return false;
  }



  function updateMore(){

    if(allPostsLoaded()){

      moreBtn.classList.add('done');

      moreBtn.style.display = 'none';

    }else{

      moreBtn.classList.remove('done');

      moreBtn.classList.remove('loading');

      const q =
        document.getElementById('search');

      /*
       * Only show Load More if we are not
       * currently searching.
       */
      if(
        !q ||
        !q.value.trim()
      ){
        moreBtn.style.display = 'inline-block';
      }
    }


    const q =
      document.getElementById('search');


    /*
     * Search manages its own counter.
     */
    if(
      q &&
      q.value.trim()
    ){
      return;
    }


    if(totalPosts === null){

      countEl.textContent =
        allLoaded.length
          ? allLoaded.length + ' posts'
          : '';

      return;
    }


    const total =
      Math.max(
        totalPosts,
        allLoaded.length
      );


    const loaded =
      Math.min(
        allLoaded.length,
        total
      );


    countEl.textContent =
      loaded +
      ' of ' +
      total +
      ' posts';
  }



  function loadNext(after){

    if(
      fetching ||
      archiveExhausted
    ){
      return;
    }


    fetching = true;

    moreBtn.classList.add('loading');


    /*
     * IMPORTANT:
     *
     * Capture the index this request is using.
     * Then immediately reserve the NEXT page.
     *
     * This prevents applyFilter() from
     * accidentally requesting the same
     * Blogger batch again.
     */
    const requestStart =
      startIndex;


    startIndex += PAGE;


    const CB =
      'bloggerPage_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 1e9);


    window[CB] = function(json){

      fetching = false;


      if(
        json.feed &&
        json.feed.openSearch$totalResults
      ){

        totalPosts =
          parseInt(
            json.feed.openSearch$totalResults.$t,
            10
          );

      }


      const entries =
        (
          json.feed &&
          json.feed.entry
        )
          ? json.feed.entry
          : [];


      /*
       * If Blogger returned fewer than PAGE,
       * we reached the end.
       */
      if(entries.length < PAGE){
        archiveExhausted = true;
      }


      /*
       * No posts at all.
       */
      if(
        !entries.length &&
        allLoaded.length === 0
      ){

        postsEl.innerHTML =
          '<div class="empty mono">' +
          'No posts yet. Check back soon.' +
          '</div>';


        moreBtn.classList.add('done');

        moreBtn.style.display = 'none';


        cleanupCallback();


        return;
      }


      /*
       * Remove duplicates before rendering.
       */
      const uniqueEntries = [];


      entries.forEach(function(entry){

        const key =
          postKey(entry);


        if(loadedKeys.has(key)){
          return;
        }


        loadedKeys.add(key);

        allLoaded.push(entry);

        uniqueEntries.push(entry);

      });


      /*
       * Render only new posts.
       */
      if(uniqueEntries.length){

        renderAppend(uniqueEntries);

      }else{

        /*
         * Even if this Blogger batch contained
         * nothing new, re-run the current filter.
         */
        applyFilter();

      }


      updateMore();

      cleanupCallback();


      if(typeof after === 'function'){
        after();
      }


      function cleanupCallback(){

        try{
          delete window[CB];
        }catch(e){}

        if(
          s &&
          s.parentNode
        ){
          s.parentNode.removeChild(s);
        }
      }
    };


    const s =
      document.createElement('script');


    const labelPath =
      (
        typeof BLOG_FILTER !== 'undefined' &&
        BLOG_FILTER
      )
        ? (
            '/-/' +
            encodeURIComponent(BLOG_FILTER)
          )
        : '';


    s.src =
      'https://' +
      BLOG_ID +
      '/feeds/posts/default' +
      labelPath +

      '?alt=json-in-script' +

      '&max-results=' +
      PAGE +

      '&start-index=' +
      requestStart +

      '&callback=' +
      CB;


    s.onerror = function(){

      fetching = false;

      /*
       * Put the page index back because this
       * request failed and can be retried.
       */
      startIndex = requestStart;


      moreBtn.classList.remove('loading');


      if(allLoaded.length === 0){

        postsEl.innerHTML =
          '<div class="empty mono">' +
          'Couldn\'t load posts right now.' +
          '</div>';

      }


      try{
        delete window[CB];
      }catch(e){}

    };


    document.body.appendChild(s);
  }



  function applyFilter(){

    const search =
      document.getElementById('search');


    const q =
      search.value
        .trim()
        .toLowerCase();


    let shown = 0;


    postsEl
      .querySelectorAll('.post')
      .forEach(function(card){

        const haystack =
          card.getAttribute('data-search') || '';


        const hit =
          !q ||
          haystack.indexOf(q) !== -1;


        card.style.display =
          hit
            ? ''
            : 'none';


        if(hit){
          shown++;
        }

      });


    /*
     * Remove old search-status message.
     */
    const oldNote =
      document.getElementById('search-note');


    if(oldNote){
      oldNote.remove();
    }


    if(q){

      /*
       * Hide manual pagination during search.
       */
      moreBtn.style.display = 'none';


      countEl.textContent =
        shown +
        (
          shown === 1
            ? ' match'
            : ' matches'
        ) +
        ' for "' +
        q +
        '"';


      /*
       * Keep searching backward through
       * the Blogger archive until the
       * entire archive has been checked.
       */
      if(!allPostsLoaded()){

        const hint =
          document.createElement('div');


        hint.id =
          'search-note';


        hint.className =
          'empty mono';


        hint.style.opacity =
          '.7';


        hint.textContent =
          shown
            ? 'Searching earlier posts…'
            : (
                'Searching the archive for "' +
                q +
                '"…'
              );


        postsEl.parentNode.insertBefore(
          hint,
          moreBtn.closest('.more-wrap') || null
        );


        if(!fetching){

          loadNext(function(){

            /*
             * Only continue searching if
             * the visitor is still searching
             * for the same thing.
             */
            const current =
              document
                .getElementById('search')
                .value
                .trim()
                .toLowerCase();


            if(current === q){
              applyFilter();
            }

          });

        }

      }else{

        /*
         * Entire Blogger archive searched.
         */
        if(!shown){

          const none =
            document.createElement('div');


          none.id =
            'search-note';


          none.className =
            'empty mono';


          none.textContent =
            'No posts found for "' +
            q +
            '".';


          postsEl.parentNode.insertBefore(
            none,
            moreBtn.closest('.more-wrap') || null
          );

        }

      }

    }else{

      /*
       * Search cleared.
       */
      postsEl
        .querySelectorAll('.post')
        .forEach(function(card){
          card.style.display = '';
        });


      if(!allPostsLoaded()){

        moreBtn.style.display =
          'inline-block';

      }


      updateMore();

    }
  }



  /*
   * Start.
   */
  (function(){

    if(
      typeof BLOG_ID === 'undefined' ||
      !BLOG_ID
    ){

      postsEl.innerHTML =
        '<div class="empty mono">' +
        'Blog not configured yet.' +
        '</div>';

      return;
    }


    loadNext();

  })();
</script>
