<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

<title>Blog | Eric Kuhns</title>

<meta
  name="description"
  content="Writing from Eric Kuhns on tech, skating, sci-fi, and building things."
>

<style>
  :root{
    --bg:#0a0c0a;
    --panel:#101410;
    --ink:#f4f6f4;
    --muted:#8a938c;
    --line:#1e241e;
    --neon:#39ff64;
    --neon-dim:#1f8a37;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .mono{
    font-family:'JetBrains Mono','SF Mono',ui-monospace,'Courier New',monospace;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.14) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode:overlay;
    opacity:.5;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px;
  }

  .head{
    padding:72px 0 40px;
    border-bottom:1px solid var(--line);
  }

  .head .prompt{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--neon-dim);
    letter-spacing:1px;
    margin-bottom:18px;
  }

  .head .prompt .path{
    color:var(--muted);
  }

  .head h1{
    font-size:clamp(34px,6vw,60px);
    font-weight:800;
    letter-spacing:-2px;
    min-height:1.1em;
  }

  .head h1 .type-caret{
    color:var(--neon);
    animation:blink 1.05s steps(1) infinite;
    font-weight:400;
  }

  .head p{
    color:var(--muted);
    margin-top:14px;
    max-width:560px;
  }

  /* search + filter bar */
  .tools{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    padding:28px 0 0;
  }

  .search{
    flex:1;
    min-width:220px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    padding:11px 14px;
  }

  .search:focus{
    outline:none;
    border-color:var(--neon-dim);
  }

  .count{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }

  .list{
    padding:32px 0 60px;
  }

  .posts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }

  .post{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    transition:all .2s;
    display:flex;
    flex-direction:column;
  }

  .post:hover{
    border-color:var(--neon-dim);
    transform:translateY(-3px);
  }

  .post:hover h3{
    color:var(--neon);
  }

  .post-thumb{
    aspect-ratio:4/3;
    background:linear-gradient(135deg,#0d130d,#060806);
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--neon-dim);
    letter-spacing:1px;
    background-size:cover;
    background-position:center;
  }

  .post-body{
    padding:20px;
    display:flex;
    flex-direction:column;
    flex:1;
  }

  .post .date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
  }

  .post h3{
    font-size:17px;
    font-weight:700;
    margin:8px 0;
    transition:color .2s;
    line-height:1.3;
  }

  .post .excerpt{
    font-size:14px;
    color:var(--muted);
    flex:1;
  }

  .post .cats{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:14px;
  }

  .post .cat{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--neon);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:2px;
    display:inline-block;
  }

  .empty{
    font-family:'JetBrains Mono',monospace;
    color:var(--muted);
    padding:40px 0;
    grid-column:1/-1;
  }

  .empty a{
    color:var(--neon);
  }

  .more-wrap{
    display:flex;
    justify-content:center;
    padding:36px 0 0;
  }

  .more{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:.5px;
    padding:13px 28px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
    transition:all .2s;
  }

  .more:hover{
    border-color:var(--neon);
    color:var(--neon);
    box-shadow:0 0 18px rgba(57,255,100,.2);
  }

  .more.loading{
    opacity:.5;
    pointer-events:none;
  }

  .more.done{
    display:none;
  }

  @media(max-width:820px){
    .posts{
      grid-template-columns:1fr 1fr;
    }
  }

  @media(max-width:560px){
    .posts{
      grid-template-columns:1fr;
    }
  }

  @media(prefers-reduced-motion:reduce){
    *{
      animation:none!important;
      transition:none!important;
    }
  }
</style>

<link rel="stylesheet" href="../site.css?v=6">
</head>

<body>

<script>
  window.SITE={
    active:"blog",
    base:"../"
  };
</script>

<div id="site-nav"></div>

<header class="head">
  <div class="wrap">

    <h1 class="typed">
      <span id="typed-title"></span>
      <span class="type-caret">_</span>
    </h1>

    <p>
      Welcome to my blog where I cover tech, adventure/travel,
      skateboarding, pop culture, nostalgia, and anything else
      that pops into my head.
    </p>

    <div class="tools">
      <input
        class="search"
        id="search"
        placeholder="search posts…"
        oninput="applyFilter()"
      >

      <span
        class="count mono"
        id="count"
      ></span>
    </div>

  </div>
</header>

<section class="list">
  <div class="wrap">

    <div
      class="posts"
      id="posts"
    >
      <div class="empty mono">
        Loading posts…
      </div>
    </div>

    <div class="more-wrap">
      <button
        class="more mono"
        id="more"
        style="display:none"
        onclick="loadNext()"
      >
        Load more posts
      </button>
    </div>

  </div>
</section>

<div id="site-footer"></div>

<script src="blog-config.js"></script>

<script>
  /*
   * Typewriter effect
   */
  (function(){

    const target =
      document.getElementById('typed-title');

    if(!target){
      return;
    }

    const text =
      "Eric J. Kuhns Blog";

    const reduce =
      window.matchMedia &&
      window
        .matchMedia(
          '(prefers-reduced-motion: reduce)'
        )
        .matches;

    if(reduce){

      target.textContent =
        text;

      return;
    }

    let i = 0;

    (function tick(){

      if(i <= text.length){

        target.textContent =
          text.slice(0,i);

        i++;

        setTimeout(
          tick,
          65
        );
      }

    })();

  })();



  /*
   * Close nav dropdowns
   */
  document.addEventListener(
    'click',
    function(e){

      if(!e.target.closest('.nav-drop')){

        document
          .querySelectorAll('.nav-drop.open')
          .forEach(function(d){

            d.classList.remove('open');

          });

      }

    }
  );



  /*
   * Safely escape text inserted into HTML
   * and HTML attributes.
   */
  function esc(s){

    return (s || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");

  }



  function fmtDate(iso){

    try{

      return new Date(iso)
        .toLocaleDateString(
          'en-US',
          {
            year:'numeric',
            month:'short',
            day:'numeric'
          }
        );

    }catch(e){

      return '';

    }

  }



  function firstImage(html){

    const m =
      (html || '')
        .match(
          /<img[^>]+src=["']([^"']+)["']/i
        );

    return m
      ? m[1]
      : '';

  }



  function toText(html){

    const d =
      document.createElement('div');

    d.innerHTML =
      html || '';

    return (d.textContent || '')
      .replace(/\s+/g,' ')
      .trim();

  }



  /*
   * Get the same YYYY/MM/post-slug path
   * used by the individual post page.
   */
  function postSlug(entry){

    const alt =
      (entry.link || [])
        .find(function(l){

          return l.rel === 'alternate';

        });


    const href =
      alt
        ? alt.href
        : '';


    const m =
      href.match(
        /\/(\d{4})\/(\d{2})\/([^\/]+)\.html/
      );


    return m
      ? (
          m[1] + '/' +
          m[2] + '/' +
          m[3]
        )
      : encodeURIComponent(
          entry.id &&
          entry.id.$t
            ? entry.id.$t
            : href
        );

  }



  /*
   * Stable unique identifier used to
   * prevent the same Blogger entry from
   * appearing more than once.
   */
  function postKey(entry){

    if(
      entry &&
      entry.id &&
      entry.id.$t
    ){

      return entry.id.$t;

    }

    return postSlug(entry);

  }



  /*
   * Blogger pagination
   */
  const PAGE = 30;

  /*
   * Blogger uses 1-based indexes.
   */
  let startIndex = 1;

  /*
   * Blogger's reported number of posts.
   */
  let totalPosts = null;

  /*
   * Every unique post we've loaded.
   */
  let allLoaded = [];

  /*
   * Keys used for duplicate protection.
   */
  let loadedKeys =
    new Set();

  let fetching =
    false;

  let renderedOnce =
    false;

  /*
   * Becomes true when Blogger returns
   * fewer than PAGE entries.
   */
  let archiveExhausted =
    false;



  const postsEl =
    document.getElementById('posts');

  const moreBtn =
    document.getElementById('more');

  const countEl =
    document.getElementById('count');



  /*
   * Create one blog card.
   */
  function cardHTML(e){

    const title =
      e.title
        ? e.title.$t
        : 'Untitled';


    const content =
      (
        e.content &&
        e.content.$t
      ) ||
      (
        e.summary &&
        e.summary.$t
      ) ||
      '';


    const date =
      e.published
        ? e.published.$t
        : '';


    const img =
      firstImage(content);


    const cats =
      (e.category || [])
        .map(function(c){

          return c.term;

        });


    const slug =
      postSlug(e);


    /*
     * Full article text.
     *
     * IMPORTANT:
     * This is used by search.
     */
    const fullText =
      toText(content);


    /*
     * Only the visible preview gets shortened.
     */
    const excerpt =
      fullText.length > 120
        ? fullText.slice(0,120) + '…'
        : fullText;


    /*
     * Search indexes:
     *
     * - full post title
     * - full article body
     * - Blogger labels
     */
    const searchText =
      (
        title + ' ' +
        fullText + ' ' +
        cats.join(' ')
      )
      .toLowerCase();


    /*
     * Use JSON.stringify to safely generate
     * a CSS URL string inside the style attr.
     */
    const thumbStyle =
      img
        ? (
            ' style="background-image:url(' +
            JSON.stringify(img) +
            ')"'
          )
        : '';


    const thumbText =
      img
        ? ''
        : (
            '[ ' +
            esc(cats[0] || 'post') +
            ' ]'
          );


    return (
      '<a class="post"' +

        ' href="post.html?p=' +
        encodeURIComponent(slug) +
        '"' +

        ' data-search="' +
        esc(searchText) +
        '"' +

      '>' +

        '<div class="post-thumb"' +
          thumbStyle +
        '>' +

          thumbText +

        '</div>' +


        '<div class="post-body">' +

          '<span class="date mono">' +
            fmtDate(date) +
          '</span>' +


          '<h3>' +
            esc(title) +
          '</h3>' +


          '<div class="excerpt">' +
            esc(excerpt) +
          '</div>' +


          (
            cats.length
              ? (
                  '<div class="cats">' +

                    cats
                      .map(function(c){

                        return (
                          '<span class="cat mono">' +
                            esc(c) +
                          '</span>'
                        );

                      })
                      .join('') +

                  '</div>'
                )
              : ''
          ) +

        '</div>' +

      '</a>'
    );

  }



  /*
   * Add newly loaded posts to the page.
   */
  function renderAppend(entries){

    if(
      !renderedOnce ||
      postsEl.querySelector('.empty')
    ){

      postsEl.innerHTML =
        '';

      renderedOnce =
        true;

    }


    entries.forEach(function(e){

      postsEl.insertAdjacentHTML(
        'beforeend',
        cardHTML(e)
      );

    });


    /*
     * Re-run the active search after new
     * archive entries have been added.
     */
    applyFilter();

  }



  /*
   * Determine whether every Blogger page
   * has been checked.
   */
  function allPostsLoaded(){

    if(archiveExhausted){

      return true;

    }


    if(
      totalPosts !== null &&
      startIndex > totalPosts
    ){

      return true;

    }


    return false;

  }



  /*
   * Update Load More button + normal
   * post counter.
   */
  function updateMore(){

    if(allPostsLoaded()){

      moreBtn.classList.add('done');

      moreBtn.style.display =
        'none';

    }else{

      moreBtn.classList.remove('done');

      moreBtn.classList.remove('loading');


      const q =
        document.getElementById('search');


      /*
       * Only show the button if no search
       * is currently active.
       */
      if(
        !q ||
        !q.value.trim()
      ){

        moreBtn.style.display =
          'inline-block';

      }

    }


    const q =
      document.getElementById('search');


    /*
     * Search has its own result counter.
     */
    if(
      q &&
      q.value.trim()
    ){

      return;

    }


    if(totalPosts === null){

      countEl.textContent =
        allLoaded.length
          ? allLoaded.length + ' posts'
          : '';

      return;

    }


    const total =
      Math.max(
        totalPosts,
        allLoaded.length
      );


    const loaded =
      Math.min(
        allLoaded.length,
        total
      );


    countEl.textContent =
      loaded +
      ' of ' +
      total +
      ' posts';

  }



  /*
   * Fetch the next Blogger archive batch.
   */
  function loadNext(after){

    /*
     * Never start overlapping requests.
     */
    if(
      fetching ||
      archiveExhausted
    ){

      return;

    }


    fetching =
      true;


    moreBtn.classList.add(
      'loading'
    );


    /*
     * VERY IMPORTANT FIX:
     *
     * Capture the index being used by this
     * request and immediately reserve the
     * next page.
     *
     * The old code didn't advance the index
     * until AFTER renderAppend().
     *
     * Since renderAppend() runs applyFilter(),
     * searching could trigger another
     * loadNext() with the SAME index.
     *
     * That was one source of duplicate posts.
     */
    const requestStart =
      startIndex;


    startIndex +=
      PAGE;


    const CB =
      'bloggerPage_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 1e9
      );


    const s =
      document.createElement('script');


    /*
     * Blogger JSONP callback.
     */
    window[CB] =
      function(json){

        fetching =
          false;


        /*
         * Blogger's total result count.
         */
        if(
          json.feed &&
          json.feed.openSearch$totalResults
        ){

          totalPosts =
            parseInt(
              json.feed
                .openSearch$totalResults
                .$t,
              10
            );

        }


        const entries =
          (
            json.feed &&
            json.feed.entry
          )
            ? json.feed.entry
            : [];


        /*
         * Fewer than PAGE means there is
         * no next Blogger page.
         */
        if(entries.length < PAGE){

          archiveExhausted =
            true;

        }


        /*
         * Blog genuinely has zero posts.
         */
        if(
          !entries.length &&
          allLoaded.length === 0
        ){

          postsEl.innerHTML =
            '<div class="empty mono">' +
              'No posts yet. Check back soon.' +
            '</div>';


          moreBtn.classList.add(
            'done'
          );


          moreBtn.style.display =
            'none';


          cleanupCallback();

          return;

        }


        /*
         * Duplicate protection.
         *
         * Even if Blogger returns an overlapping
         * page for any reason, we only render
         * entries that have never been seen.
         */
        const uniqueEntries =
          [];


        entries.forEach(function(entry){

          const key =
            postKey(entry);


          if(
            loadedKeys.has(key)
          ){

            return;

          }


          loadedKeys.add(key);

          allLoaded.push(entry);

          uniqueEntries.push(entry);

        });


        if(uniqueEntries.length){

          renderAppend(
            uniqueEntries
          );

        }else{

          /*
           * Keep the current search state updated
           * even if Blogger returned no new cards.
           */
          applyFilter();

        }


        updateMore();


        cleanupCallback();


        /*
         * Used by archive search to continue
         * loading older batches.
         */
        if(
          typeof after === 'function'
        ){

          after();

        }



        function cleanupCallback(){

          try{

            delete window[CB];

          }catch(e){}


          if(
            s &&
            s.parentNode
          ){

            s.parentNode.removeChild(s);

          }

        }

      };


    const labelPath =
      (
        typeof BLOG_FILTER !== 'undefined' &&
        BLOG_FILTER
      )
        ? (
            '/-/' +
            encodeURIComponent(
              BLOG_FILTER
            )
          )
        : '';


    s.src =
      'https://' +
      BLOG_ID +

      '/feeds/posts/default' +

      labelPath +

      '?alt=json-in-script' +

      '&max-results=' +
      PAGE +

      '&start-index=' +
      requestStart +

      '&callback=' +
      CB;


    /*
     * Restore this page number if the
     * request itself fails.
     */
    s.onerror =
      function(){

        fetching =
          false;


        startIndex =
          requestStart;


        moreBtn.classList.remove(
          'loading'
        );


        if(
          allLoaded.length === 0
        ){

          postsEl.innerHTML =
            '<div class="empty mono">' +
              'Couldn\'t load posts right now.' +
            '</div>';

        }


        try{

          delete window[CB];

        }catch(e){}


        if(
          s &&
          s.parentNode
        ){

          s.parentNode.removeChild(s);

        }

      };


    document.body.appendChild(
      s
    );

  }



  /*
   * Search the blog.
   *
   * Search checks every currently loaded
   * post immediately.
   *
   * If older Blogger pages have not yet
   * been fetched, it continues loading the
   * archive until every post has been checked.
   */
  function applyFilter(){

    const search =
      document.getElementById('search');


    const q =
      search.value
        .trim()
        .toLowerCase();


    let shown =
      0;


    postsEl
      .querySelectorAll('.post')
      .forEach(function(card){

        const haystack =
          card.getAttribute(
            'data-search'
          ) || '';


        const hit =
          !q ||
          haystack.indexOf(q) !== -1;


        card.style.display =
          hit
            ? ''
            : 'none';


        if(hit){

          shown++;

        }

      });



    /*
     * Remove previous temporary search message.
     */
    const oldNote =
      document.getElementById(
        'search-note'
      );


    if(oldNote){

      oldNote.remove();

    }



    if(q){

      /*
       * Don't make the visitor manually press
       * Load More while searching.
       */
      moreBtn.style.display =
        'none';


      countEl.textContent =
        shown +
        (
          shown === 1
            ? ' match'
            : ' matches'
        ) +
        ' for "' +
        q +
        '"';



      /*
       * There are still older posts that have
       * not been downloaded.
       *
       * Keep going until the full archive has
       * been searched.
       */
      if(!allPostsLoaded()){

        const hint =
          document.createElement(
            'div'
          );


        hint.id =
          'search-note';


        hint.className =
          'empty mono';


        hint.style.opacity =
          '.7';


        hint.textContent =
          shown
            ? 'Searching earlier posts…'
            : (
                'Searching the archive for "' +
                q +
                '"…'
              );


        postsEl.parentNode.insertBefore(
          hint,
          moreBtn.closest('.more-wrap') || null
        );


        /*
         * Only one Blogger request can exist
         * at a time.
         */
        if(!fetching){

          loadNext(
            function(){

              /*
               * The visitor may have changed the
               * search while the request was loading.
               *
               * Only continue the old search if the
               * search text is still the same.
               */
              const current =
                document
                  .getElementById('search')
                  .value
                  .trim()
                  .toLowerCase();


              if(current === q){

                applyFilter();

              }

            }
          );

        }

      }else{

        /*
         * Every post has now been checked.
         */
        if(!shown){

          const none =
            document.createElement(
              'div'
            );


          none.id =
            'search-note';


          none.className =
            'empty mono';


          none.textContent =
            'No posts found for "' +
            q +
            '".';


          postsEl.parentNode.insertBefore(
            none,
            moreBtn.closest('.more-wrap') || null
          );

        }

      }


    }else{

      /*
       * Search was cleared.
       *
       * Restore every loaded card.
       */
      postsEl
        .querySelectorAll('.post')
        .forEach(function(card){

          card.style.display =
            '';

        });


      if(!allPostsLoaded()){

        moreBtn.style.display =
          'inline-block';

      }


      updateMore();

    }

  }



  /*
   * Initial blog load.
   */
  (function(){

    if(
      typeof BLOG_ID === 'undefined' ||
      !BLOG_ID
    ){

      postsEl.innerHTML =
        '<div class="empty mono">' +
          'Blog not configured yet.' +
        '</div>';

      return;

    }


    loadNext();

  })();

</script>

<script src="../site.js?v=6"></script>

</body>
</html>
