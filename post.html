<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… | Eric Kuhns</title>
<style>
  :root{
    --bg:#0a0c0a;--panel:#101410;--ink:#f4f6f4;--muted:#8a938c;
    --line:#1e241e;--neon:#39ff64;--neon-dim:#1f8a37;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,'Courier New',monospace}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:overlay;opacity:.5}
  a{color:var(--neon);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}

  nav{position:sticky;top:0;z-index:100;background:rgba(10,12,10,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:1080px;margin:0 auto;padding:0 24px}
  .logo{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.5px;font-size:15px;color:var(--ink)}
  .logo-caret{color:var(--neon);animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .nav-links{display:flex;gap:28px;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
  .nav-links a{color:var(--muted);transition:color .2s}
  .nav-links a:hover{color:var(--neon)}
  .menu-btn{display:none;background:none;border:none;color:var(--neon);font-size:22px;cursor:pointer;font-family:monospace}

  .back{display:inline-block;margin:32px 0 0;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)}
  .back:hover{color:var(--neon);text-decoration:none}

  article{padding:24px 0 80px}
  .post-head{padding:20px 0 28px;border-bottom:1px solid var(--line);margin-bottom:36px}
  .post-meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--neon);letter-spacing:1px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .post-meta .sep{color:var(--muted)}
  .post-meta .cat{color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:2px}
  h1.title{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-1.5px;line-height:1.05}

  .content{font-size:17px;color:#dfe4df}
  .content h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:40px 0 14px;color:var(--ink)}
  .content h3{font-size:20px;font-weight:700;margin:32px 0 10px;color:var(--ink)}
  .content h1{font-size:28px;font-weight:800;margin:36px 0 12px;color:var(--ink)}
  .content p{margin:0 0 20px}
  .content ul,.content ol{margin:0 0 20px 22px}
  .content li{margin:0 0 8px}
  .content img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:3px;margin:12px 0;display:block}
  .content a{color:var(--neon)}
  .content blockquote{border-left:3px solid var(--neon-dim);padding:4px 0 4px 20px;margin:0 0 20px;color:var(--muted);font-style:italic}
  .content b,.content strong{color:var(--ink)}
  .content iframe{max-width:100%;border:0;border-radius:3px;margin:0 0 20px;position:relative;z-index:10000}
  .content .yt-wrap{position:relative;width:100%;aspect-ratio:16/9;margin:0 0 20px;border:1px solid var(--line);border-radius:3px;overflow:hidden;z-index:10000}
  .content .yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;margin:0}
  .content hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  .content table{width:100%;border-collapse:collapse;margin:0 0 20px}
  .content td,.content th{border:1px solid var(--line);padding:8px 10px}

  .loading,.err{font-family:'JetBrains Mono',monospace;color:var(--muted);padding:60px 0}
  .err a{color:var(--neon)}

  footer{padding:48px 0 40px;border-top:1px solid var(--line)}
  .foot-note{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);max-width:760px;margin:0 auto;padding:0 24px}
  .foot-note b{color:var(--neon)}

  @media(max-width:820px){
    .nav-links{display:none}
    .nav-links.open{display:flex;position:absolute;top:60px;left:0;right:0;flex-direction:column;background:var(--panel);padding:20px 24px;gap:18px;border-bottom:1px solid var(--line)}
    .menu-btn{display:block}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="../index.html" class="logo">ericjkuhns<span class="logo-caret">_</span></a>
    <button class="menu-btn" onclick="document.getElementById('nl').classList.toggle('open')">[≡]</button>
    <div class="nav-links" id="nl">
      <a href="../index.html#projects">Projects</a>
      <a href="../index.html#videos">Videos</a>
      <a href="index.html">Blog</a>
      <a href="../index.html#book">Book</a>
      <a href="../index.html#contact">Contact</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <a href="index.html" class="back">← back to all posts</a>
</div>

<article class="wrap" id="article">
  <div class="loading mono">Loading post…</div>
</article>

<footer>
  <div class="foot-note mono">
    Built by hand. Powered by <b>tech + adventure</b>. © 2026 Eric Kuhns
  </div>
</footer>

<script src="blog-config.js"></script>
<script>
  function getParam(name){ const m=new RegExp('[?&]'+name+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):null; }
  function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return ''; } }

  function cleanContent(html){
    const tmp=document.createElement('div'); tmp.innerHTML=html||'';
    tmp.querySelectorAll('script,style,link').forEach(function(n){ n.remove(); });
    tmp.querySelectorAll('[style]').forEach(function(n){ n.removeAttribute('style'); });
    tmp.querySelectorAll('[bgcolor]').forEach(function(n){ n.removeAttribute('bgcolor'); });
    tmp.querySelectorAll('iframe').forEach(function(f){
      const w=document.createElement('div'); w.className='yt-wrap';
      f.parentNode.insertBefore(w,f); w.appendChild(f);
      f.removeAttribute('width'); f.removeAttribute('height');
    });
    return tmp.innerHTML;
  }

  function renderPost(post){
    const title = post.title ? post.title.$t : 'Untitled';
    const date = post.published ? post.published.$t : '';
    const cats = (post.category || []).map(function(c){ return c.term; });
    const content = (post.content && post.content.$t) || '';
    document.title = title + ' | Eric Kuhns';
    document.getElementById('article').innerHTML =
      '<div class="post-head">'+
        '<div class="post-meta mono">'+fmtDate(date)+
          (cats.length ? '<span class="sep">/</span>'+cats.map(function(c){return '<span class="cat">'+esc(c)+'</span>';}).join('') : '')+
        '</div>'+
        '<h1 class="title">'+esc(title)+'</h1>'+
      '</div>'+
      '<div class="content">'+cleanContent(content)+'</div>';
  }

  function fail(){
    document.getElementById('article').innerHTML = '<div class="err mono">Couldn\'t load this post. <a href="index.html">Back to all posts →</a></div>';
  }

  const slug = getParam('p'); // format: 2026/08/my-title
  const article = document.getElementById('article');

  if(typeof BLOG_ID === 'undefined' || !BLOG_ID){
    article.innerHTML = '<div class="err mono">Blog not configured yet.</div>';
  } else if(!slug){
    article.innerHTML = '<div class="err mono">No post specified. <a href="index.html">Back to all posts →</a></div>';
  } else {
    function slugOf(e){
      const alt = (e.link||[]).find(function(l){ return l.rel==='alternate'; });
      const href = alt ? alt.href : '';
      const m = href.match(/\/(\d{4})\/(\d{2})\/([^\/]+)\.html/);
      return m ? (m[1]+'/'+m[2]+'/'+m[3]) : encodeURIComponent(e.id.$t);
    }
    // Page through the feed (500 at a time) until we find the matching post.
    let start = 1;
    const BATCH = 500;
    let attempts = 0;
    function fetchBatch(){
      attempts++;
      const CB = 'bloggerFind_' + Math.floor(Math.random()*1e9);
      window[CB] = function(json){
        const entries = (json.feed && json.feed.entry) ? json.feed.entry : [];
        const match = entries.find(function(e){ return slugOf(e) === slug; });
        if(match){ renderPost(match); try{delete window[CB];}catch(e){} return; }
        // not found in this batch: go deeper if there might be more
        if(entries.length === BATCH && attempts < 6){
          start += BATCH;
          try{delete window[CB];}catch(e){}
          fetchBatch();
        } else {
          fail();
        }
      };
      const s = document.createElement('script');
      s.src = 'https://'+BLOG_ID+'/feeds/posts/default?alt=json-in-script&max-results='+BATCH+'&start-index='+start+'&callback='+CB;
      s.onerror = fail;
      document.body.appendChild(s);
    }
    fetchBatch();
  }
</script>

</body>
</html>
